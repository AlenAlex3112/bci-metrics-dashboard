<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bird Count India · Metrics Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --ink:#16302B; --ink2:#33534B; --paper:#F2F4F1; --card:#FBFCFA; --line:#D6DED6;
    --teal:#0E7C7B; --tealDeep:#0A4F4E; --rufous:#C4622D; --ochre:#D98A3D;
    --sage:#8FA99B; --brick:#B4472B; --mut:#7C8C84;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  header.top{border-bottom:1px solid var(--line);background:var(--card);padding:14px 22px;}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .brandmark{width:38px;height:38px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:var(--paper);font-family:'Space Grotesk';font-weight:700;font-size:18px;}
  .title{font-family:'Space Grotesk';font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1;}
  .sub{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--mut);margin-top:3px;}
  .btn{font-family:'Space Grotesk';font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.15s;}
  .btn:hover{border-color:var(--teal);color:var(--teal);}
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.primary:hover{background:var(--tealDeep);color:#fff;border-color:var(--tealDeep);}
  .tab{font-family:'Space Grotesk';font-size:13px;font-weight:600;letter-spacing:.02em;padding:7px 14px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink2);transition:.15s;}
  .tab.on{background:var(--ink);color:var(--paper);}
  .tab:not(.on):hover{border-color:var(--line);}
  select,input[type=text]{font-family:'Space Grotesk';font-size:12.5px;font-weight:500;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);}
  input[type=text]{font-family:'IBM Plex Mono';}
  label.small{font-family:'Space Grotesk';font-size:12px;color:var(--mut);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .h2{font-family:'Space Grotesk';margin:0;font-size:15px;display:flex;gap:8px;align-items:center;}
  .kpi-n{font-family:'IBM Plex Mono';font-weight:600;font-variant-numeric:tabular-nums;}
  main{padding:22px;display:grid;gap:20px;align-items:start;}
  main.two{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);}
  main.one{grid-template-columns:1fr;}
  table.dt{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.dt th{text-align:left;font-family:'Space Grotesk';font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);}
  table.dt td{padding:7px 10px;border-bottom:1px solid #EDF1ED;}
  table.dt td.n{font-family:'IBM Plex Mono';text-align:right;font-variant-numeric:tabular-nums;}
  table.dt tr:hover td{background:#F4F8F5;}
  .pill{font-family:'Space Grotesk';font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;color:#fff;}
  .subhead{font-family:'Space Grotesk';font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:6px;}
  .note{font-size:11.5px;color:var(--mut);line-height:1.5;}
  .warn{font-size:12px;color:var(--rufous);display:flex;gap:6px;align-items:flex-start;line-height:1.45;margin-top:8px;}
  .src{padding:12px 22px;background:#EEF2EE;border-bottom:1px solid var(--line);}
  .src .row{gap:10px;}
  .status{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--ink2);}
  path.region{cursor:pointer;transition:fill .15s;}
  .legendbar{height:10px;border-radius:5px;}
  a{color:var(--teal);}
  details.help{font-size:12px;color:var(--ink2);}
  details.help summary{cursor:pointer;font-family:'Space Grotesk';font-weight:600;color:var(--teal);}
  code{font-family:'IBM Plex Mono';background:#EAEEEA;padding:1px 5px;border-radius:4px;font-size:11.5px;}
</style>
</head>
<body>

<header class="top">
  <div class="row" style="justify-content:space-between;">
    <div class="row">
      <div class="brandmark">BC</div>
      <div>
        <div class="title">Bird Count India · Metrics</div>
        <div class="sub" id="sourceLabel">Jun-26 sample · eBird effort &amp; participation</div>
      </div>
    </div>
    <div class="row" id="exportBtns">
      <button class="btn" id="btnRefresh">↻ Refresh</button>
      <button class="btn" id="btnXlsx">⤓ Excel</button>
      <button class="btn" id="btnChartPng">⤓ Chart PNG</button>
      <button class="btn" id="btnMapPng">⤓ Map PNG</button>
    </div>
  </div>
  <div class="row" style="margin-top:14px;">
    <div class="row" style="gap:4px;background:var(--paper);padding:4px;border-radius:10px;">
      <button class="tab" data-level="national">National</button>
      <button class="tab on" data-level="state">State</button>
      <button class="tab" data-level="district">District</button>
    </div>
    <div class="row"><label class="small">Metric</label><select id="metricSel"></select></div>
    <div class="row" id="colorWrap"><label class="small">Colour by</label>
      <select id="colorSel"><option value="CUR">Latest month</option><option value="YoY%">YoY %</option></select>
    </div>
    <div class="row" id="dtStateWrap"><label class="small">State</label><select id="dtStateSel"></select></div>
    <div class="row" id="monthWrap"><label class="small">Month</label><select id="monthSel"></select></div>
  </div>
</header>

<!-- Live data status -->
<section class="src">
  <div class="row" style="justify-content:space-between;">
    <span class="status" id="sheetStatus">Starting up…</span>
    <span class="note" id="srcHint"></span>
  </div>
</section>

<main class="two" id="main"></main>
<section id="tableWrap" style="padding:0 22px 30px;"></section>
<footer style="padding:0 22px 34px;" class="note">
  Live data loads automatically from the configured Google Sheet; <code>st.geojson</code> / <code>dt.geojson</code> load from this folder. Zones and Power/Average/Weak are editable assumptions (see chat / top of source).
</footer>

/* ---- helpers ---- */
const num = v => { if(v==null) return null; const s=String(v).replace(/["',]/g,"").trim();
  if(s===""||s==="-") return null; const n=Number(s); return Number.isFinite(n)?n:null; };
const fmt = n => (n==null?"—":n.toLocaleString("en-IN"));
const fmtPct = n => (n==null?"—":`${n>0?"+":""}${n}%`);
const normName = s => String(s||"").toLowerCase().replace(/&/g,"and")
  .replace(/\b(islands?|state|district|nct|of|the)\b/g,"").replace(/[^a-z0-9]/g,"").trim();
const b64ToText = b64 => { const bin=atob(b64); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return new TextDecoder("utf-8").decode(a); };
const rowsOf = t => Papa.parse(String(t).trim(),{skipEmptyLines:true}).data;

/* ---- parsers (accept raw 2D rows so both CSV and Sheet feeds share them) ---- */
function parseINRows(rows){
  const header=rows[0].slice(1); const metrics={};
  for(let i=1;i<rows.length;i++){const r=rows[i]; const name=String(r[0]||"").trim(); if(!name)continue;
    const vals={}; let has=false;
    header.forEach((h,j)=>{const v=num(r[j+1]); vals[h]=v; if(v!==null)has=true;});
    metrics[name]={...vals,_has:has};}
  return {header,metrics};
}
function parseGroupedRows(rows,isDT){
  const g0=rows[0],g1=rows[1]||[]; const cols=[]; let carry="";
  for(let j=0;j<g0.length;j++){ if(String(g0[j]||"").trim())carry=String(g0[j]).trim();
    cols.push({group:carry,sub:String(g1[j]||"").trim()}); }
  const metricStart=isDT?2:1; const KNOWN=["Observations","Lists","Users","High Concern Percent (%)"];
  const out=[];
  for(let i=2;i<rows.length;i++){ const r=rows[i]; const code=String(r[0]||"").trim();
    if(isDT){ if(!/^IN-[A-Z]+-[A-Z0-9]+$/.test(code))continue; }
    else if(!/^[A-Z]{2}$/.test(code))continue;
    const rec={code};
    if(isDT){rec.name=String(r[1]||"").trim(); rec.state=code.split("-")[1];}
    else{rec.name=STATE_NAMES[code]||code;}
    const metrics={};
    for(let j=metricStart;j<cols.length;j++){const {group,sub}=cols[j];
      if(!KNOWN.includes(group)||!sub)continue; (metrics[group]||(metrics[group]={}))[sub]=num(r[j]);}
    rec.metrics=metrics; out.push(rec);
  }
  return out;
}
const parseIN = t => parseINRows(rowsOf(t));
const parseGrouped = (t,isDT) => parseGroupedRows(rowsOf(t),isDT);

/* current-month sub-field of a MMM-YY tab = the month abbrev in its name */
function monthOf(tabName){ const m=/^([A-Za-z]{3})-(\d{2})/.exec(tabName); return m?{mon:m[1],yy:+m[2]}:null; }
function pickCur(rec,metric,monAbbrev){ const m=rec.metrics&&rec.metrics[metric]; if(!m)return null;
  return (m[monAbbrev]!=null?m[monAbbrev]:null); }
function pick(rec,metric,field){ const m=rec.metrics&&rec.metrics[metric]; return m?(m[field]??null):null; }

/* ================================================================= *
 *  STATE
 * ================================================================= */
const S = {
  level:"state", metric:"Observations", colorField:"CUR", dtState:"ALL",
  months:{},          // { "Jun-26": {national, states, districts} }
  monthKeys:[],       // sorted ["...","Jun-26"]
  activeMonth:null,
  geo:{national:null,state:null,district:null}, // {geojson,props,joinProp,matchBy}
  hover:null,
};

/* ingest one month's three feeds (rows or parsed) */
function addMonthData(key, {inRows, stRows, dtRows}){
  const mon = monthOf(key)?.mon || "Jun";
  S.months[key] = {
    national: inRows?parseINRows(inRows):null,
    states:   stRows?parseGroupedRows(stRows,false):[],
    districts:dtRows?parseGroupedRows(dtRows,true):[],
    mon
  };
  recomputeMonthKeys();
}
function recomputeMonthKeys(){
  const order = k=>{const m=monthOf(k); return m?(2000+m.yy)*12+MONTHS.indexOf(m.mon):0;};
  S.monthKeys = Object.keys(S.months).sort((a,b)=>order(a)-order(b));
  if(!S.activeMonth || !S.months[S.activeMonth]) S.activeMonth = S.monthKeys[S.monthKeys.length-1];
}

/* ================================================================= *
 *  DERIVED (for active month + level)
 * ================================================================= */
function activeMon(){ return S.months[S.activeMonth]; }
function curMonAbbrev(){ return activeMon()?.mon || "Jun"; }

function getRows(){
  const M=activeMon(); if(!M) return [];
  const cm=curMonAbbrev();
  if(S.level==="state")
    return M.states.map(s=>({code:s.code,name:s.name,
      value:pickCur(s,S.metric,cm), prev:prevVal(s,S.metric,cm),
      yoy:pick(s,S.metric,"YoY%"),
      region:Object.entries(REGIONS).find(([,c])=>c.includes(s.code))?.[0]||"Unassigned"}));
  if(S.level==="district"){
    let d=M.districts; if(S.dtState!=="ALL") d=d.filter(x=>x.state===S.dtState);
    return d.map(x=>({code:x.code,name:x.name,state:x.state,
      value:pickCur(x,S.metric,cm), prev:prevVal(x,S.metric,cm),
      yoy:pick(x,S.metric,"YoY%"), region:STATE_NAMES[x.state]||x.state}));
  }
  return [];
}
/* previous month value: the OTHER data sub-column (not current, not YoY%) */
function prevVal(rec,metric,cm){ const m=rec.metrics&&rec.metrics[metric]; if(!m)return null;
  const k=Object.keys(m).find(x=>x!==cm && x!=="YoY%"); return k?m[k]:null; }

/* 5-year series for a chosen subject */
function buildSeries(subjectKind, subjectId, metric){
  // subjectKind: 'national' | 'state' | 'district'
  return S.monthKeys.map(k=>{
    const M=S.months[k], mon=M.mon; let v=null;
    if(subjectKind==="national"){ const mm=M.national?.metrics?.[metric]||M.national?.metrics?.Observations;
      v = mm ? (mm[mon] ?? null) : null; }
    else if(subjectKind==="state"){ const s=M.states.find(x=>x.code===subjectId); v=s?pickCur(s,metric,mon):null; }
    else { const d=M.districts.find(x=>x.code===subjectId); v=d?pickCur(d,metric,mon):null; }
    return {month:k, value:v};
  });
}

const $ = id => document.getElementById(id);

function metricOptions(){
  const M=activeMon();
  if(S.level==="national" && M?.national)
    return Object.keys(M.national.metrics).filter(k=>M.national.metrics[k]._has);
  return ["Observations","Lists","Users"];
}

function syncControls(){
  // level tabs
  document.querySelectorAll("[data-level]").forEach(b=>b.classList.toggle("on",b.dataset.level===S.level));
  // metric select
  const opts=metricOptions(); if(!opts.includes(S.metric)) S.metric=opts[0];
  $("metricSel").innerHTML=opts.map(o=>`<option ${o===S.metric?"selected":""}>${o}</option>`).join("");
  // show/hide controls
  $("colorWrap").style.display = S.level==="national"?"none":"flex";
  $("dtStateWrap").style.display = S.level==="district"?"flex":"none";
  // district state options
  const M=activeMon();
  if(M){ const present=Object.keys(STATE_NAMES).filter(c=>M.districts.some(d=>d.state===c));
    $("dtStateSel").innerHTML=`<option value="ALL">All states</option>`+
      present.map(c=>`<option value="${c}" ${c===S.dtState?"selected":""}>${STATE_NAMES[c]}</option>`).join(""); }
  // month select
  $("monthWrap").style.display = S.monthKeys.length>1?"flex":"none";
  $("monthSel").innerHTML=S.monthKeys.map(k=>`<option ${k===S.activeMonth?"selected":""}>${k}</option>`).join("");
  $("main").className = S.level==="national"?"one":"two";
}

function colorScale(rows){
  const vals=rows.map(r=>S.colorField==="YoY%"?r.yoy:r.value).filter(v=>v!=null);
  if(!vals.length) return ()=>"#EAEEEA";
  if(S.colorField==="YoY%"){
    const max=Math.max(Math.abs(d3.min(vals)||0),Math.abs(d3.max(vals)||0),1);
    return d3.scaleDiverging([-max,0,max],t=>d3.interpolateRgbBasis([COL.brick,"#EFE9DF",COL.tealDeep])(t));
  }
  const max=d3.max(vals);
  return d3.scaleSequential([0,max||1],t=>d3.interpolateRgbBasis(["#EAF1EE",COL.teal,COL.tealDeep])(t));
}

function render(){
  syncControls();
  const rows=getRows();
  const main=$("main"); main.innerHTML="";

  /* MAP (state/district) */
  if(S.level!=="national") main.appendChild(mapPanel(rows));

  /* summary column */
  const col=document.createElement("section");
  col.style.cssText="display:flex;flex-direction:column;gap:20px;";
  col.appendChild(kpiRow(rows));
  col.appendChild(chartPanel(rows));
  if(S.level!=="national") col.appendChild(groupPanel(rows));

/* ---------- KPIs ---------- */
function kpiRow(rows){
  const wrap=document.createElement("div");
  wrap.style.cssText="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;";
  const sum=f=>rows.reduce((a,r)=>a+(r[f]??0),0);
  const cur=sum("value"),prev=sum("prev");
  const mom = prev? Math.round((cur-prev)/prev*100):null;
  const cm=curMonAbbrev();
  const cards=[[`${S.metric} · ${cm}`,fmt(cur),null],
    [`${S.metric} · prev`,fmt(prev),null],
    ["MoM change",fmtPct(mom),cur>=prev?"pos":"neg"]];
  cards.forEach(([l,v,tone])=>{
    const d=document.createElement("div"); d.className="card"; d.style.padding="12px 14px";
    d.innerHTML=`<div class="disp" style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;">${l}</div>
      <div class="kpi-n" style="font-size:22px;margin-top:4px;color:${tone==="pos"?COL.teal:tone==="neg"?COL.brick:COL.ink}">${v}</div>`;
    wrap.appendChild(d);
  });
  return wrap;
}

  const scale=colorScale(rows);
  const proj=d3.geoMercator().fitSize([W,H],g.geojson); const gp=d3.geoPath(proj);

    sec.appendChild(w);

}

function lineChart(svg,series,W,H,m){
  const xs=series.map(d=>d.month);
  const x=d3.scalePoint().domain(xs).range([m.l,W-m.r]).padding(.5);
  const ymax=d3.max(series,d=>d.value)||1;
  const y=d3.scaleLinear().domain([0,ymax]).nice().range([H-m.b,m.t]);
  svg.append("g").attr("transform",`translate(0,${H-m.b})`).call(d3.axisBottom(x)
    .tickValues(xs.filter((_,i)=> xs.length<=12 || i%Math.ceil(xs.length/12)===0)))
    .selectAll("text").style("font-family","IBM Plex Mono").style("font-size","10px").style("fill",COL.mut);
  svg.append("g").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5)
    .tickFormat(v=>v>=1000?`${(v/1000).toFixed(0)}k`:v))
    .selectAll("text").style("font-family","IBM Plex Mono").style("font-size","10px").style("fill",COL.mut);
  svg.selectAll(".dom").remove();
  const line=d3.line().defined(d=>d.value!=null).x(d=>x(d.month)).y(d=>y(d.value)).curve(d3.curveMonotoneX);
  svg.append("path").datum(series).attr("fill","none").attr("stroke",COL.teal).attr("stroke-width",2.5).attr("d",line);
  svg.selectAll("circle").data(series.filter(d=>d.value!=null)).join("circle")
    .attr("cx",d=>x(d.month)).attr("cy",d=>y(d.value)).attr("r",3).attr("fill",COL.teal)
    .append("title").text(d=>`${d.month}: ${fmt(d.value)}`);
}
function barChart(svg,data,W,H){
  const m={t:6,r:24,b:24,l:130};
  const y=d3.scaleBand().domain(data.map(d=>d.name)).range([m.t,H-m.b]).padding(.18);
  const x=d3.scaleLinear().domain([0,d3.max(data,d=>d.value)||1]).range([m.l,W-m.r]);
  svg.append("g").attr("transform",`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(5)
    .tickFormat(v=>v>=1000?`${(v/1000).toFixed(0)}k`:v))
    .selectAll("text").style("font-family","IBM Plex Mono").style("font-size","10px").style("fill",COL.mut);
  svg.append("g").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y))
    .selectAll("text").style("font-family","Inter").style("font-size","10.5px").style("fill",COL.ink2);
  svg.selectAll(".domain").remove();
  svg.selectAll("rect").data(data).join("rect")
    .attr("x",m.l).attr("y",d=>y(d.name)).attr("height",y.bandwidth())
    .attr("width",d=>x(d.value)-m.l).attr("rx",3)
    .attr("fill",d=>S.level==="state"?(REGION_COLORS[d.region]||COL.teal):COL.teal)
    .append("title").text(d=>`${d.name}: ${fmt(d.value)}`);
}

    const roll=Object.values(acc).sort((a,b)=>b.value-a.value); const mx=roll[0]?.value||1;
    const box=document.createElement("div"); box.innerHTML=`<div class="subhead">By zone</div>`;

      const row=document.createElement("div"); row.style.marginBottom="10px";

    const bucket=v=>v>=q2?"Power":v>=q1?"Average":"Weak";
    const g={Power:[],Average:[],Weak:[]}; rows.forEach(r=>r.value!=null&&g[bucket(r.value)].push(r));
    const t=document.createElement("div"); t.style.marginTop="16px";

    const grid=document.createElement("div"); grid.style.cssText="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;";
    [["Power",COL.tealDeep],["Average",COL.ochre],["Weak",COL.brick]].forEach(([name,c])=>{
      const arr=g[name].sort((a,b)=>b.value-a.value); const tot=arr.reduce((a,r)=>a+r.value,0);
      const d=document.createElement("div"); d.style.cssText=`border:1px solid var(--line);border-radius:10px;padding:11px;`;
      d.innerHTML=`<div class="disp" style="font-size:12.5px;font-weight:600;color:${c};display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:8px;background:${c}"></span>${name}</div>
        <div class="kpi-n" style="font-size:20px;margin-top:4px;">${arr.length}</div>
        <div class="mono" style="font-size:11px;color:var(--mut);">${fmt(tot)} total</div>
        <div style="font-size:11px;color:var(--ink2);margin-top:6px;line-height:1.5;max-height:92px;overflow:auto;">${arr.slice(0,8).map(r=>r.name).join(", ")}${arr.length>8?"…":""}</div>`;
      grid.appendChild(d);
    });
    t.appendChild(grid);
    const cut=document.createElement("div"); cut.className="mono"; cut.style.cssText="font-size:10.5px;color:var(--mut);margin-top:8px;";
    cut.textContent=`cut-offs — weak < ${fmt(Math.round(q1))} ≤ average < ${fmt(Math.round(q2))} ≤ power`;
    t.appendChild(cut);
    sec.appendChild(t);
  }
  if(S.level==="district"&&S.dtState==="ALL"){
    const tip=document.createElement("div"); tip.style.marginTop="4px";
    tip.innerHTML=`<div class="subhead">Tip</div><div class="note">Districts group by parent state (from the eBird code). Pick a state above to focus the map, table and tiers.</div>`;
    sec.appendChild(tip);
  }
  return sec;
}

/* ================================================================= *
 *  GEO + SHEET LOADING
 * ================================================================= */
function ingestGeojson(gj, forLevel){
  const props=Object.keys(gj.features?.[0]?.properties||{});
  const rows=getRows(); const keys=new Set([...rows.map(r=>r.code),...rows.map(r=>normName(r.name)),
    ...rows.map(r=>r.code?.includes("-")?r.code.split("-").slice(-1)[0]:r.code)]);
  let best=props[0],bestScore=-1,bestMode="code";
  props.forEach(p=>{ let cs=0,ns=0;
    gj.features.forEach(f=>{const raw=f.properties[p];
      if(keys.has(String(raw).trim())||keys.has(String(raw).trim().toUpperCase()))cs++;
      if(keys.has(normName(raw)))ns++;});
    if(cs>bestScore){bestScore=cs;best=p;bestMode="code";}
    if(ns>bestScore){bestScore=ns;best=p;bestMode="name";}});
  S.geo[forLevel]={geojson:gj,props,joinProp:best,matchBy:bestMode};
}
async function autoLoadGeojson(){
  const map={national:"in.geojson",state:"st.geojson",district:"dt.geojson"};
  let any=false;
  for(const [lvl,file] of Object.entries(map)){
    try{ const r=await fetch(file,{cache:"no-store"}); if(!r.ok)continue;
      const gj=await r.json(); const savedLevel=S.level; S.level=lvl; ingestGeojson(gj,lvl); S.level=savedLevel; any=true; }
    catch(e){/* file:// or missing — silent */}
  }
  if(any) render();
}

/* --- Live load from CONFIG: Apps Script (/exec JSON) OR gviz CSV with gap-stop --- */
async function loadLive(){
  const status=$("sheetStatus"); const hint=$("srcHint");
  hint.textContent="";
  if(CONFIG.APPS_SCRIPT_URL){
    status.textContent="Loading via Apps Script…";
    try{
      const r=await fetch(CONFIG.APPS_SCRIPT_URL,{redirect:"follow"});
      const j=await r.json(); const tabs=j.tabs||j;
      if(tabs && Object.keys(tabs).length){ ingestTabs(tabs); return; }
      status.textContent="Apps Script returned no tabs — trying public CSV…";
    }catch(e){ status.textContent="Apps Script unreachable — trying public CSV…"; console.error(e); }
  }
  await loadViaCsv(status, hint);
}
async function loadViaCsv(status, hint){
  const id=CONFIG.SHEET_ID; const tabs={}; let ok=0, gap=0;
  const now=new Date();
  status.textContent="Loading from Google Sheet…";
  for(let i=0;i<CONFIG.MONTHS_BACK && gap<3;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=`${MONTHS[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`;
    let monthHit=0;
    for(const t of ["IN","ST","DT"]){
      const name=`${key}-${t}`;
      try{
        const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
        const res=await fetch(url); if(!res.ok) continue;
        const txt=await res.text();
        if(txt.trim().startsWith("<")) continue; // HTML error page = tab missing / not public
        tabs[name]=rowsOf(txt); ok++; monthHit++;
      }catch(e){/* skip */}
    }
    if(monthHit===0) gap++; else gap=0;
    status.textContent=`Loading from Google Sheet… ${ok} tabs`;
  }
  if(!ok){
    status.textContent="Couldn’t load live data — showing the built-in Jun-26 sample.";
    hint.innerHTML="Set the sheet to <b>Anyone with the link: Viewer</b>, or deploy <code>apps-script.gs</code> and set <code>APPS_SCRIPT_URL</code> at the top of this file.";
    return;
  }
  ingestTabs(tabs);
}
function ingestTabs(tabs){
  const byMonth={};
  Object.entries(tabs).forEach(([name,rows])=>{
    const m=/^([A-Za-z]{3}-\d{2})-(IN|ST|DT)$/.exec(name); if(!m)return;
    (byMonth[m[1]]||(byMonth[m[1]]={}))[m[2]]=rows;
  });
  if(!Object.keys(byMonth).length){ $("sheetStatus").textContent="No tabs matched MMM-YY-IN/ST/DT."; return; }
  S.months={}; // replace the embedded sample with live data
  Object.entries(byMonth).forEach(([key,t])=>addMonthData(key,{inRows:t.IN,stRows:t.ST,dtRows:t.DT}));
  recomputeMonthKeys();
  $("sourceLabel").textContent=`Live · ${S.monthKeys.length} months · ${S.monthKeys[0]}→${S.monthKeys[S.monthKeys.length-1]}`;
  $("sheetStatus").textContent=`Live · ${S.monthKeys.length} months loaded from Google Sheet`;
  render();
}

function svgToPng(svgEl,name){
  if(!svgEl){alert("Nothing to export yet.");return;}
  const xml=new XMLSerializer().serializeToString(svgEl.cloneNode(true));
  const url="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)));
  const img=new Image();
  img.onload=()=>{ const vb=svgEl.viewBox.baseVal, sc=2;
    const c=document.createElement("canvas"); c.width=(vb.width||600)*sc; c.height=(vb.height||400)*sc;
    const ctx=c.getContext("2d"); ctx.fillStyle=COL.card; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();}); };
  img.src=url;
}

    Zone:Object.entries(REGIONS).find(([,c])=>c.includes(s.code))?.[0]||"Unassigned",
    [`${S.metric} prev`]:prevVal(s,S.metric,cm),[`${S.metric} ${cm}`]:pickCur(s,S.metric,cm),"YoY%":pick(s,S.metric,"YoY%")}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(stRows),"States");
  const dtRows=M.districts.map(x=>({Code:x.code,District:x.name,State:STATE_NAMES[x.state]||x.state,
    [`${S.metric} prev`]:prevVal(x,S.metric,cm),[`${S.metric} ${cm}`]:pickCur(x,S.metric,cm),"YoY%":pick(x,S.metric,"YoY%")}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(dtRows),"Districts");
  // multi-year series (national)
  if(S.monthKeys.length>1){
    const ser=buildSeries("national",null,S.metric).map(d=>({Month:d.month,[S.metric]:d.value}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ser),"National trend");
  }
  XLSX.writeFile(wb,`ebird-metrics-${S.activeMonth}.xlsx`);
}
